# LuxGen — CI pipeline (lint, format, test, build)
# Docs: docs/deployment/MONOREPO_BUILD.md · docs/_meta/DOCUMENTATION_STANDARD.md
# Triggers: push/PR to main

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_GRAPHQL_URL: http://localhost:4000/graphql
  NEXT_PUBLIC_API_URL: http://localhost:4000
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  API_URL: http://localhost:4000

jobs:
  # Single repo, deployed separately (Render = API, Vercel = web). This job
  # reports which side(s) actually changed so it's visible in the PR/run
  # summary alongside the always-run lint/build/test below — it does not skip
  # or gate anything downstream. The real skip-the-rebuild logic lives at the
  # deploy layer: render.yaml's buildFilter (both copies) and
  # apps/web/vercel.json's ignoreCommand (turbo-ignore) each independently
  # decide whether their own platform needs to rebuild.
  detect-changes:
    name: Detect changed scope
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'Dockerfile.api'
              - 'render.yaml'
              - 'deploy/platforms/render.yaml'
            web:
              - 'apps/web/**'
            shared:
              - 'packages/**'

      - name: Summary
        run: |
          echo "### Changed scope" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: ${{ steps.filter.outputs.api }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Web: ${{ steps.filter.outputs.web }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Shared packages: ${{ steps.filter.outputs.shared }}" >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Oxlint
        run: npm run lint

  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Oxfmt check
        run: npm run format

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, format]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate build (matches Husky pre-push)
        run: sh scripts/validate-build.sh
        env:
          CI: true
          REQUIRE_WEB_BUILD: '0'

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test
        continue-on-error: true
