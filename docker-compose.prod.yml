# LuxGen — Production Docker stack
# Docs: docs/deployment/ENV_PRODUCTION.md · docs/deployment/DOCKER.md
# Usage: docker compose -f docker-compose.prod.yml up -d

version: '3.8'

services:
  # MongoDB Database (Production)
  mongodb:
    image: mongo:7.0
    container_name: luxgen-mongodb-prod
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - mongodb_prod_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - luxgen-prod-network
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Redis Cache (Production)
  redis:
    image: redis:7.2-alpine
    container_name: luxgen-redis-prod
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_prod_data:/data
    networks:
      - luxgen-prod-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # API Server (Production)
  api:
    build:
      context: .
      dockerfile: Dockerfile
      # api and web are now separate image targets (runner-api / runner-web),
      # each built from their own independent builder stage - a broken web
      # page (or any web-only dependency) can no longer block shipping api,
      # and vice versa. See Dockerfile comments for the full rationale.
      target: runner-api
      args:
        TENANT: ${TENANT:-demo}
    container_name: luxgen-api-prod
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      # Reads directly from SSM/.env instead of hardcoding the internal
      # `mongodb` service hostname - this lets MONGODB_URI point at EITHER
      # the self-hosted `mongodb` container below (mongodb://user:pass@
      # mongodb:27017/db?authSource=admin) OR a free-tier managed database
      # like MongoDB Atlas (mongodb+srv://user:pass@cluster.mongodb.net/db),
      # with no file changes - just update the SSM parameter.
      MONGODB_URI: ${MONGODB_URI}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN}
      LOG_LEVEL: info
      # Keep false in production - GraphQL introspection/Playground exposes
      # your full schema to anyone who can reach /graphql. Only flip to
      # 'true' temporarily while actively debugging.
      APOLLO_INTROSPECTION: ${APOLLO_INTROSPECTION:-false}
    depends_on:
      # mongodb is intentionally NOT a hard dependency of api anymore - this
      # is what lets you run api against an external managed database
      # (Atlas free tier, etc.) without also starting the local `mongodb`
      # container. If you want the self-hosted container instead, just add
      # `mongodb` to your `docker compose up` service list; it's unaffected.
      redis:
        condition: service_healthy
    networks:
      - luxgen-prod-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4000/health']
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Web Application (Production)
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner-web
      # These get inlined into the browser bundle at build time - setting
      # them under `environment:` below does nothing for a Next.js
      # standalone build, the page JS is already compiled by then. The app
      # reads NEXT_PUBLIC_GRAPHQL_URL (apps/web/graphql/client.ts) and
      # NEXT_PUBLIC_BASE_URL (apps/web/lib/tenant.ts, tenant-switcher links).
      args:
        TENANT: ${TENANT:-demo}
        NEXT_PUBLIC_GRAPHQL_URL: ${NEXT_PUBLIC_GRAPHQL_URL}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
    container_name: luxgen-web-prod
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - luxgen-prod-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Nginx Reverse Proxy (Production)
  nginx:
    image: nginx:alpine
    container_name: luxgen-nginx-prod
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - web
      - api
    networks:
      - luxgen-prod-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost/health']
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Monitoring (Optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: luxgen-prometheus
    restart: unless-stopped
    ports:
      - '9090:9090'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - luxgen-prod-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:latest
    container_name: luxgen-grafana
    restart: unless-stopped
    ports:
      - '3001:3000'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - luxgen-prod-network
    depends_on:
      - prometheus

volumes:
  mongodb_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  nginx_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  luxgen-prod-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
